name: udderly-website-staging

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      WAITLIST_DATA_DIR: /data/waitlist
      APP_HOST: ${APP_HOST}
      # Always keep staging non-indexable, regardless of the host environment.
      PUBLIC_CANONICAL_ORIGIN: ""
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-}
      RESEND_API_KEY: ""
      CONTACT_SMTP_HOST: ""
      CONTACT_SMTP_PORT: ""
      CONTACT_SMTP_USER: ""
      CONTACT_SMTP_PASSWORD: ""
    volumes:
      - waitlist-data:/data/waitlist
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.udderly-website-staging.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.udderly-website-staging.entrypoints=websecure
      - traefik.http.routers.udderly-website-staging.tls=true
      - traefik.http.routers.udderly-website-staging.tls.certresolver=letsencrypt
      - traefik.http.routers.udderly-website-staging.service=udderly-website-staging
      - traefik.http.services.udderly-website-staging.loadbalancer.server.port=3000
      - traefik.http.middlewares.udderly-website-staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive
      - traefik.http.middlewares.udderly-website-staging-noindex.headers.contenttypenosniff=true
      - traefik.http.middlewares.udderly-website-staging-noindex.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.routers.udderly-website-staging.middlewares=udderly-website-staging-noindex

volumes:
  waitlist-data:

networks:
  web:
    external: true
